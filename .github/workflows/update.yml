name: Update catalogue
on:
  schedule:
    - cron: '0 6 * * *'      # every day 06:00 UTC (07:00 UK)
  workflow_dispatch: {}       # also run on demand from the Actions tab
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrape brands (fresh stock + new drops)
        run: python ci_scrape.py
      - name: Build starter outfits
        run: python build_outfits.py || echo "outfits skipped"
      - name: Build catalogue
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          pip install --quiet cryptography
          mkdir -p site
          OUT=site/index.html PER_DOMAIN=50 FULL_CAP=150 MAX_TOTAL=6000 python build_catalog.py
      - name: Save data back to repo
        run: |
          git config user.name "catalogue-bot"
          git config user.email "catalogue-bot@users.noreply.github.com"
          git add rows newdrops.json favourites.json || true
          git commit -m "auto-update $(date -u +%F)" || echo "no changes"
          git push || echo "push skipped"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
